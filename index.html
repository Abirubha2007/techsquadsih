<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meet Our Team</title>
    <!-- Google Fonts for typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <!-- Background Decor -->
    <div class="bg-decor top-left"></div>
    <div class="bg-decor bottom-right"></div>
    <div class="dot-grid top-left-dots"></div>
    <div class="dot-grid top-right-dots"></div>

    <div class="container">
        <!-- Header Section -->
        <header class="header">
            <div class="logo-wrapper">
                <img src="/images/tech-squad-logo.png" alt="Tech Squad Logo" class="tech-squad-logo">
            </div>
            <h1 class="heading">Meet Our Team</h1>
            
            <p class="subtext">
                A passionate team of innovators and problem solvers<br>
                working together to build impactful solutions.
            </p>
        </header>

        <!-- Team Grid Section -->
        <main>
            <div class="team-grid" id="team-grid">
                <!-- Cards will be injected here by JavaScript -->
            </div>
        </main>

        <!-- Footer Section -->
        <footer class="footer-card">
            <div class="footer-left">
                <div class="rocket-wrapper">
                    <i data-lucide="rocket"></i>
                </div>
                <span class="footer-text">Building Today,<br>Innovating Tomorrow &ndash; <strong>Together.</strong></span>
            </div>
            <div class="footer-right">
                <span class="footer-prompt">Want to know more about our project?</span>
                <a href="https://it-taskmanager.onrender.com/" target="_blank" class="pill-btn">
                    View Deployed Project
                    <i data-lucide="external-link" class="btn-icon"></i>
                </a>
            </div>
        </footer>
    </div>

    <script type="module" src="/script.js"></script>
</body>
</html>
